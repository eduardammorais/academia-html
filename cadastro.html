<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta chasert="UTF-8">
        <tittle> Cadastro Usuario </tittle>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form id="formCadastro">
            <h2> Cadastrar Usuário </h2>
            <input type="text" id="novoUsuario" placeholder="Novo Usuario" required>
            <input type="password" id="novaSenha" placeholder="Nova Senha" required>
            <button type="submit"> Cadastrar </button> 
            <button type="button" id="btnVoltarhome" class="btn-secundario">Voltar</button>
        </form>
        
        <script src="script.js"></script> 
        <script>
            const usuarioLogado = localStorage.getItem('usuarioLogado');
            if(usuarioLogado){
                window.location.href='index.html';
            }

            document.getElementById('btnVoltarhome').addEventListener('click', function(){
                window.location.href="home.html";
            });
        </script>
    </body>
</html>
